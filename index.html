<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Happy Birthday APPA</title>
    <style>
        body {
            background-color: #121212; /* Dark, moody aesthetic */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #ffd700; /* Gold heading */
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #aaaaaa;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            max-width: 600px;
            margin: 0 auto;
        }
        .frame {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333333;
            width: 100%;
            box-sizing: border-box;
        }
        .frame img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }
    </style>
</head>
<body>

<script>
alert("🎉 Happy Birthday Dad! 🎂");
</script>

<h1>🎉 Happy Birthday APPA! 🎉</h1>
<p class="subtitle">Welcome to your Hall of Fame.</p>

<div class="gallery">
    <div class="frame">
        <img src="photo1.jpg" alt="Dad Photo 1">
    </div>
    <div class="frame">
        <img src="photo2.jpg" alt="Dad Photo 2">
    </div>
    <div class="frame">
        <img src="photo3.jpg" alt="Dad Photo 3">
    </div>
</div>

</html>
